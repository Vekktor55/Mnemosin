# Политики провайдеров: таймауты, ретраи, circuit breaker, цены.
# v3 §V.11. Единственный источник retry/timeout — этот файл (не аргументы порта, F-7.2).
#
# costPer1kTokens: null → цена неизвестна, costUsd не считается (UNKNOWN#5).
# Фактические цены появятся в промпте 2.8 (config/model-prices.yaml).
policies:
  - providerId: scripted
    capability: TEXT_AI
    timeoutMs: 5000
    retries: { max: 0, backoffMs: 500, jitter: false }
    circuitBreaker: { failureThreshold: 3, cooldownMs: 30000 }
    costPer1kTokens: { input: null, output: null }

  - providerId: echo
    capability: TEXT_AI
    timeoutMs: 5000
    retries: { max: 0, backoffMs: 500, jitter: false }
    circuitBreaker: { failureThreshold: 3, cooldownMs: 30000 }
    costPer1kTokens: { input: null, output: null }

