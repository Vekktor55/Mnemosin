# CI (архитектура v4, переходный этап).
#
# Порядок шагов: lint → typecheck → тесты по проектам → coverage-пороги
# (активные пакеты ядра v4) → build (tsc + vite client) → npm audit →
# secret scanning. Stage 1 (verify:stage1, e2e/Playwright) удалён: старый
# Table MVP и e2e отложены до P05 (см. docs/IMPLEMENTATION_ROADMAP.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    env:
      NODE_ENV: test
      AI_PROVIDER: scripted
      MEDIA_PROVIDER: debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: npm ci
        run: npm ci

      - name: lint (eslint + prettier)
        run: npm run lint

      - name: typecheck (tsc -b)
        run: npm run typecheck

      - name: test:unit
        run: npm run test:unit

      - name: test:integration
        run: npm run test:integration

      - name: test:arch
        run: npm run test:arch

      - name: test:contract
        run: npm run test:contract

      - name: coverage + пороги v4 (активные пакеты ядра)
        run: npx vitest run --coverage

      - name: build (tsc -b + vite client)
        run: |
          npm run build
          npm run build -w client

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: artifact — coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node${{ matrix.node }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
