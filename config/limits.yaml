# Лимиты и настройки (v3 §VI.10, §VIII.6; образец — MNEMOSIN_v3_AUDIT.md §8.9).
# Все значения валидируются LimitsConfigSchema при старте.

# Партия
maxPlayersPerSession: 12
actionsPerPlayerPerTurn: 5
maxMessageLen: 1000
chatRingBuffer: 500

# WebSocket
wsRatePerConnection:
  ACTION_SUBMIT: 5
  CHAT_PUBLIC: 10
  DEFAULT: 20
wsMaxConnectionsPerIp: 20
wsMaxConnectionsPerPlayer: 4
wsMaxPayloadBytes: 65536
wsAuthTimeoutMs: 5000
heartbeat:
  intervalMs: 20000
  idleTimeoutMs: 45000
reconnect:
  baseMs: 500
  factor: 2
  capMs: 15000
  jitter: 0.2
  maxAttempts: 8
dedupeTtlMs: 300000

# Идемпотентность и outbox
idempotencyTtlHours: 24
idempotencyInFlightTimeoutMs: 120000
outboxBatchSize: 100
outboxPollMs: 250
outboxMaxAttempts: 5

# AI
aiMaxConcurrentPerSession: 1
aiMaxRetriesPerTurn: 2
aiContextMaxTokens: 24000
# Базовые указания AI-Директору (промпт 1.7): попадают в DirectorContext.directorInstructions.
# Многострочный YAML-блок; лимит схемы — 6000 символов.
aiDirectorInstructions: |-
  Ты — AI-Директор настольной ролевой игры МНЕМОСИН (ведущий-соавтор, GM-in-the-loop).
  По действиям игроков за ход верни ОДИН объект AIResponse, строго соответствующий схеме:
  narrative — художественное разрешение хода на русском (без имён персонажей, если они не представлены в фактах);
  privateMessages — только тем игрокам, которым персонально положено приватное знание;
  proposedEvents — ТОЛЬКО eventId из allowedEventIds (пустой массив, если список пуст);
  proposedObjectChanges — только объекты текущей локации из objectStates, минимальные правки состояния;
  visualSceneDescription — одна короткая сцена для будущего медиа-контура либо null.
  Запрещено: выдумывать несуществующие объекты и выходы, раскрывать gmSecret, менять локацию группы, завершать сессию.
  Тон: сдержанная тревога, бытовые детали, никакого всеведения — персонажи знают только storyFacts и свои знания.

# Media (этап 2)
mediaMaxConcurrentPerSession: 2
mediaMaxRetriesPerJob: 1

# Capability Registry
capabilityProbeMs: 30000

# Event Engine (этап 2)
eventCascadeMaxDepth: 3

# Шина событий (промпт 1.5): таймаут одного async-обработчика
handlerTimeoutMs: 5000

# Чат (промпт 1.9): token bucket публичных сообщений на игрока
chat:
  publicPerSecond: 10
  burstSeconds: 1

# Бюджет (этап 2: фактическое значение — после замера, D139)
sessionBudgetUsd: 5

# HTTP rate limit
httpRatePerIpPerMin: 100
httpRatePerTokenPerMin: 300
httpRateAuthPerIpPerMin: 10
